name: Publish to PyPI
on:
  workflow_dispatch:  # run by hand, once the version and HISTORY.md are updated
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/frame2text4llm/
    permissions:
      id-token: write  # Trusted Publishing: PyPI trusts this workflow, no token is stored
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
